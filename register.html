<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0b0a1a">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Выбор аватаров для группы перед игрой в научном музее.">
<title>Выбор аватаров</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800&amp;family=Unbounded:wght@600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<noscript><p class="status">Для работы экрана нужен включённый JavaScript.</p></noscript>
<div class="app">
  <header class="bar">
    <div class="bar__title">
      <h1>Выбери своего зверя</h1>
      <p class="bar__sub">Запомни его и три буквы: на стенде нужно будет найти себя внизу экрана.</p>
    </div>
    <p class="count" id="count" aria-live="polite">Занято 0 из 30</p>
    <a class="btn btn--primary" href="index.html">Готово, к рейтингу</a>
  </header>
  <main class="view">
    <ul class="zoo" id="zoo" aria-label="Аватары"></ul>
  </main>
</div>
<p class="status" id="status" role="status" hidden></p>
<script src="sdk/museum-sdk.js"></script>
<script src="js/register.js"></script>
</body>
</html>
